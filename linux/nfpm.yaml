# nfpm: .deb and .rpm. Template: linux/build.sh replaces each @…@, then runs nfpm from build/linux/pkgroot.
# Dependencies = libraries the slimmed bundle leaves to the system (measured on 9 distros). build.sh rejects a
# bundle that needs a library neither bundled nor listed in the .rpm Requires below; the .deb
# declares the Debian/Ubuntu packages that provide them.
name: agent-burn-desktop
arch: amd64
platform: linux
version: "@VERSION@"
release: "1"
section: utils
priority: optional
maintainer: Berthelot Samuel <samuel.berthelot11@gmail.com>
vendor: Berthelot Samuel
homepage: https://github.com/Magikdidi24/agent-burn-desktop
# SPDX expression of the whole content (.rpm License field; the .deb has none: /usr/share/doc/…/copyright).
license: "@PKG_LICENSE@"
description: |-
  Claude Code usage and live subscription limits
  System tray icon, popover and dashboard on the agent-burn CLI
  (bundled): API-equivalent spend, tokens, models, session and weekly limits.
contents:
  - src: ./opt/agent-burn-desktop
    dst: /opt/agent-burn-desktop
    type: tree
  - src: /opt/agent-burn-desktop/agent-burn-desktop
    dst: /usr/bin/agent-burn-desktop
    type: symlink
  - src: ./usr/share/applications/io.github.magikdidi24.AgentBurn.desktop
    dst: /usr/share/applications/io.github.magikdidi24.AgentBurn.desktop
  - src: ./usr/share/metainfo/io.github.magikdidi24.AgentBurn.metainfo.xml
    dst: /usr/share/metainfo/io.github.magikdidi24.AgentBurn.metainfo.xml
  - src: ./usr/share/icons/hicolor/*/apps/io.github.magikdidi24.AgentBurn.png
    dst: /usr/share/icons/hicolor
  - src: ./usr/share/doc/agent-burn-desktop/copyright
    dst: /usr/share/doc/agent-burn-desktop/copyright
    packager: deb
    file_info:
      mode: 0644
deb:
  compression: zstd   # xz: 30 s on a single core; dpkg reads zstd on every targeted .deb distro
rpm:
  compression: zstd
overrides:
  deb:
    depends:
      - libc6 (>= @GLIBC@)
      - libbrotli1
      - libdbus-1-3
      - libdrm2
      - libegl1
      - libexpat1
      - libffi8
      - libfontconfig1
      - libfreetype6
      - libgcc-s1
      - libgl1
      - libglib2.0-0
      - libgssapi-krb5-2
      - liblzma5
      - libssl3
      - libstdc++6
      - libwayland-client0
      - libwayland-cursor0
      - libwayland-egl1
      - libx11-6
      - libx11-xcb1
      - libxcb1
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libzstd1
      - zlib1g
    recommends:
      - fonts-dejavu-core
      - libgl1-mesa-dri
  rpm:
    depends:
      - "libc.so.6(GLIBC_@GLIBC@)(64bit)"
      - "libbrotlicommon.so.1()(64bit)"
      - "libbrotlidec.so.1()(64bit)"
      - "libcrypto.so.3()(64bit)"
      - "libdbus-1.so.3()(64bit)"
      - "libdrm.so.2()(64bit)"
      - "libEGL.so.1()(64bit)"
      - "libexpat.so.1()(64bit)"
      - "libffi.so.8()(64bit)"
      - "libfontconfig.so.1()(64bit)"
      - "libfreetype.so.6()(64bit)"
      - "libgcc_s.so.1()(64bit)"
      - "libgio-2.0.so.0()(64bit)"
      - "libGL.so.1()(64bit)"
      - "libglib-2.0.so.0()(64bit)"
      - "libgobject-2.0.so.0()(64bit)"
      - "libgssapi_krb5.so.2()(64bit)"
      - "libgthread-2.0.so.0()(64bit)"
      - "liblzma.so.5()(64bit)"
      - "libssl.so.3()(64bit)"
      - "libstdc++.so.6()(64bit)"
      - "libwayland-client.so.0()(64bit)"
      - "libwayland-cursor.so.0()(64bit)"
      - "libwayland-egl.so.1()(64bit)"
      - "libX11.so.6()(64bit)"
      - "libX11-xcb.so.1()(64bit)"
      - "libxcb.so.1()(64bit)"
      - "libxkbcommon.so.0()(64bit)"
      - "libxkbcommon-x11.so.0()(64bit)"
      - "libz.so.1()(64bit)"
      - "libzstd.so.1()(64bit)"
    # Fedora then openSUSE names: a name unknown to a distro is ignored there (weak dependency).
    recommends:
      - mesa-dri-drivers
      - Mesa-dri
      - dejavu-sans-fonts
      - dejavu-fonts
