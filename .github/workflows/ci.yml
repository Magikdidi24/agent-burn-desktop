# App de bureau Agent Burn (Windows + Linux) : tests, paquets Linux essayés sur 7 distros, installeur et zip
# Windows, brouillon de release sur un tag desktop-v*. Caches, artefacts de courte durée, runs dépassés annulés.
name: Agent Burn (bureau)

on:
  push:
    branches: ['**']
    tags: ['desktop-v*']   # chemins non évalués pour un tag : il lance tout, release comprise
    paths-ignore:   # docs seules : rien à construire
      - '**/*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      arm64:
        description: Construire aussi Windows ARM64 (expérimental)
        type: boolean
        default: false

permissions:
  contents: read

# Par PR, sinon par branche ou tag : un nouveau push annule le run en cours. Pas de github.head_ref : la PR d'un
# fork depuis une branche « main » (ou « desktop-v… ») annulerait le run de celle du dépôt.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/requirements.lock

      # Le selftest rend avec OpenGL même hors écran : Xvfb + Mesa (llvmpipe) le lui fournissent.
      - name: Bibliothèques Qt, Xvfb et Mesa
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libglib2.0-0t64 libfontconfig1 libgssapi-krb5-2 libdbus-1-3 fonts-dejavu-core \
            libgl1 libgl1-mesa-dri libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            xvfb xauth

      # Verrou haché (versions et sha256 de tout l'arbre) : celui des builds.
      - name: Dépendances Python
        run: python -m pip install --require-hashes -r app/requirements.lock

      - name: Tests unitaires
        working-directory: app
        run: dbus-run-session -- python -m unittest discover -s tests -v

      # Générateur des notices des crates du CLI, livrées dans chaque paquet.
      - name: Outils de licence
        run: python -m unittest discover -s tools -v

      - name: Suite Burn.qml (shim)
        working-directory: app
        run: dbus-run-session -- python tests/run_burn_suite.py

      - name: 'Suite Burn.qml : fichiers persistés corrompus'
        working-directory: app
        run: BURN_TEST=corrupt dbus-run-session -- python tests/run_burn_suite.py

      - name: Suivi amont
        run: python3 -I scripts/test_agent_burn_upstream.py

      - name: Selftest (Xvfb, fixtures)
        working-directory: app
        run: |
          AGENT_BURN_FAKE_DIR="$PWD/../tests/fixtures" AGENT_BURN_BIN="$PWD/tests/fake-agent-burn" \
            AGENT_BURN_DATA="$RUNNER_TEMP/selftest-data" \
            xvfb-run -a -s '-screen 0 1920x1080x24' \
            dbus-run-session -- python -m agentburn --selftest "$RUNNER_TEMP/selftest"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: selftest-linux-dev
          path: ${{ runner.temp }}/selftest/
          retention-days: 7

      # En dernier : 2 min d'attente (Burn.qml tue le CLI bloqué à 120 s).
      - name: 'Suite Burn.qml : CLI bloqué'
        working-directory: app
        run: BURN_TEST=timeout dbus-run-session -- python tests/run_burn_suite.py

  linux:
    name: Linux (paquets)
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      # Épinglée par empreinte (index multi-arch), comme dans linux/build-local.sh : elle produit les paquets.
      image: docker.io/library/python:3.12-slim-bookworm@sha256:6a0e06f5ba0b373d051aabd3fffb9b873f27f9a2a3a14bcbe37dee6f0e3bbc70
    env:
      # Une seule liste pour restaurer et sauvegarder : elle entre dans la version du cache.
      CLI_CACHE: |
        ~/.cargo/registry/index/
        ~/.cargo/registry/cache/
        ~/.cargo/git/db/
        build/cli-linux
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Révision du CLI (cli.env)
        id: rev
        run: |
          rev=$(sed -nE 's/^AB_REV=([0-9a-f]+).*/\1/p' cli.env)
          echo "rev=${rev:?AB_REV introuvable dans cli.env}" >> "$GITHUB_OUTPUT"

      - id: cli
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ env.CLI_CACHE }}
          key: agent-burn-cli-linux-x64-${{ steps.rev.outputs.rev }}
          restore-keys: agent-burn-cli-linux-x64-

      # Polices extraites (app/fonts, ignoré par git) : build.sh revérifie leurs sha256 et retélécharge au moindre écart.
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: app/fonts
          key: fonts-jetbrainsmono-nf-v3.4.0   # à changer avec la version des polices de build.sh et build.ps1

      - name: 'Build : bundle, AppImage, .deb, .rpm, archive'
        env:
          CLI_HIT: ${{ steps.cli.outputs.cache-hit }}
        run: |
          # Restauré par restore-keys : CLI d'une autre révision, seul le registre cargo resservira.
          if [ "$CLI_HIT" = true ]; then export SKIP_CLI=1; else rm -rf build/cli-linux; fi
          bash linux/build.sh

      # Dès que le CLI est compilé, même si la suite échoue : le prochain essai ne le recompile pas.
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        if: ${{ !cancelled() && steps.cli.outputs.cache-hit != 'true' && hashFiles('build/cli-linux/**/agent-burn') != '' }}
        with:
          path: ${{ env.CLI_CACHE }}
          key: ${{ steps.cli.outputs.cache-primary-key }}

      # Aussi en échec : dist/linux/selftest/ dit pourquoi.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: agent-burn-desktop-linux
          path: dist/linux/
          if-no-files-found: error
          retention-days: 1   # ~300 Mo par run ; les releases gardent les paquets

  linux-smoke:
    name: Paquets sur ${{ matrix.image }}
    needs: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Étiquettes, pas d'empreinte : ces images ne produisent rien, elles essaient les paquets sur des distros à jour.
        image: [ubuntu:22.04, ubuntu:24.04, debian:12, debian:13, fedora:44, archlinux:latest, opensuse/tumbleweed]
    container:
      image: ${{ matrix.image }}
    steps:
      # Sans git dans l'image : checkout par l'API (archive), suffisant pour smoke.sh.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # Chemin relatif à l'espace de travail : dans un job « container », ${{ runner.temp }} serait le chemin de
      # l'hôte et $RUNNER_TEMP celui du conteneur.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent-burn-desktop-linux
          path: dist-in

      - name: Installation et selftest
        run: |
          chmod +x dist-in/*.AppImage   # un artefact ne garde pas le bit exécutable
          bash linux/smoke.sh "$PWD/dist-in"

      # Journaux d'installation, de selftest et de désinstallation de smoke.sh (dist-in/smoke-<distro>/).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: smoke-${{ strategy.job-index }}
          path: dist-in/smoke-*/
          retention-days: 7

  windows:
    name: ${{ matrix.arch == 'arm64' && 'Windows ARM64 (expérimental)' || 'Windows x64' }}
    needs: test
    runs-on: ${{ matrix.arch == 'arm64' && 'windows-11-arm' || 'windows-2025' }}
    timeout-minutes: 45
    continue-on-error: ${{ matrix.arch == 'arm64' }}
    strategy:
      fail-fast: false
      matrix:
        # ARM64 seulement à la demande (workflow_dispatch, case arm64) ; son échec ne fait pas échouer le run.
        arch: ${{ fromJSON(inputs.arm64 && '["x64", "arm64"]' || '["x64"]') }}
    defaults:
      run:
        shell: pwsh
    env:
      ARCH: ${{ matrix.arch }}
      CLI_CACHE: |
        ~/.cargo/registry/index/
        ~/.cargo/registry/cache/
        ~/.cargo/git/db/
        build/cli
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          # 3.13 : python.org ne publie plus de binaires Windows de 3.12 (sources seules), son OpenSSL ou sa SQLite
          # ne seraient plus corrigés. Linux garde 3.12 (image de build).
          python-version: '3.13'
          architecture: ${{ matrix.arch }}
          cache: pip
          cache-dependency-path: app/requirements.lock

      # Dans le venv de build.ps1 (.venv) : les tests voient l'environnement du build, que build.ps1 ne fait que
      # revérifier.
      - name: Dépendances Python
        run: |
          python -m venv .venv
          ./.venv/Scripts/python.exe -m pip install --require-hashes -r app/requirements.lock

      # Sur un vrai Windows : winreg, ctypes et chemins Windows ne sont pas simulés. UTF-8 dans ce step seulement
      # (sinon cp1252, et les messages en français arrivent abîmés) : build.ps1 et le selftest restent en cp1252.
      - name: Tests unitaires
        working-directory: app
        timeout-minutes: 5   # ~20 s : une fenêtre Qt bloquée ne tient pas le job 45 min
        env:
          PYTHONIOENCODING: utf-8
        run: ../.venv/Scripts/python.exe -m unittest discover -s tests -v

      - name: Révision du CLI (cli.env)
        id: rev
        run: |
          $rev = [regex]::Match((Get-Content -Raw cli.env), '(?m)^AB_REV=(\w+)').Groups[1].Value
          if (-not $rev) { throw 'AB_REV introuvable dans cli.env' }
          "rev=$rev" >> $env:GITHUB_OUTPUT

      - id: cli
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ env.CLI_CACHE }}
          key: agent-burn-cli-windows-${{ matrix.arch }}-${{ steps.rev.outputs.rev }}
          restore-keys: agent-burn-cli-windows-${{ matrix.arch }}-

      # Comme sous Linux : build.ps1 revérifie les sha256 (zip de 129 Mo sinon téléchargé à chaque run).
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: app/fonts
          key: fonts-jetbrainsmono-nf-v3.4.0

      - name: Inno Setup (si absent de l'image)
        run: |
          if (-not (Test-Path 'C:/Program Files (x86)/Inno Setup 6/ISCC.exe')) { choco install innosetup --version=6.7.1 -y --no-progress }

      - name: 'Build : CLI, bundle, selftest, zip, installeur'
        id: build
        env:
          CLI_HIT: ${{ steps.cli.outputs.cache-hit }}
        run: |
          if ($env:CLI_HIT -eq 'true') { pwsh -File build.ps1 -Arch $env:ARCH -SkipCli }
          else {
              # Restauré par restore-keys : CLI d'une autre révision, seul le registre cargo resservira.
              Remove-Item build/cli -Recurse -Force -ErrorAction Ignore
              pwsh -File build.ps1 -Arch $env:ARCH
          }

      # Dès que le CLI est compilé, même si la suite échoue : le prochain essai ne le recompile pas.
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        if: ${{ !cancelled() && steps.cli.outputs.cache-hit != 'true' && hashFiles('build/cli/**/agent-burn.exe') != '' }}
        with:
          path: ${{ env.CLI_CACHE }}
          key: ${{ steps.cli.outputs.cache-primary-key }}

      # Avant smoke.ps1 : en cas d'échec, l'installeur reste téléchargeable pour l'essayer à la main.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-burn-desktop-windows-${{ matrix.arch }}
          path: |
            dist/AgentBurn-Setup-*-${{ matrix.arch }}.exe
            dist/AgentBurn-portable-*-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 1   # ~110 Mo par run ; les releases gardent les paquets

      - name: Installation, lancement, désinstallation
        run: |
          $setup = (Resolve-Path "dist/AgentBurn-Setup-*-$env:ARCH.exe").Path
          $zip = (Resolve-Path "dist/AgentBurn-portable-*-$env:ARCH.zip").Path
          pwsh -File windows/smoke.ps1 -Setup $setup -Portable $zip

      # dist/smoke/ de smoke.ps1 : journaux d'installation et de désinstallation, selftests de l'exe installé et du
      # zip ; sans la copie extraite du zip (~170 Mo).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.build.outcome != 'skipped' }}   # rien à déposer sans build
        with:
          name: selftest-windows-${{ matrix.arch }}
          path: |
            dist/selftest/
            dist/smoke/
            !dist/smoke/portable/
          retention-days: 7

  release:
    name: Release (brouillon)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-v')
    needs: [linux, linux-smoke, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: agent-burn-desktop-*
          path: dl

      # Paquets seulement (ni selftest ni SHA256SUMS partiel du build Linux) ; une somme pour tous.
      - name: SHA256SUMS et brouillon de release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Paquets nommés d'après __version__ : un tag d'une autre version donnerait une release au titre faux.
          v=${GITHUB_REF_NAME#desktop-v}
          [ -f "dl/agent-burn-desktop-linux/agent-burn-desktop_${v}_amd64.deb" ] &&
            [ -f "dl/agent-burn-desktop-windows-x64/AgentBurn-Setup-$v-x64.exe" ] ||
            { echo "::error::tag $GITHUB_REF_NAME : pas de paquets $v (__version__ de l'app différente ?)"; exit 1; }
          mkdir release
          cp dl/agent-burn-desktop-linux/*.{tar.gz,AppImage,deb,rpm} dl/agent-burn-desktop-windows-x64/*.{exe,zip} release/
          (cd release && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "Agent Burn $v (app de bureau)" \
            --notes "Brouillon créé par la CI : $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Vérification : sha256sum -c SHA256SUMS" \
            -- release/*
