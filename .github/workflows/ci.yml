# Agent Burn desktop app (Windows + Linux): tests, Linux packages tried on 7 distros, Windows installer and zip,
# draft release on a desktop-v* tag. Caches, packages kept 30 days (7 for logs), superseded runs canceled.
name: Agent Burn (desktop)

on:
  push:
    branches: ['**']
    tags: ['desktop-v*']   # paths not evaluated for a tag: it runs everything, release included
    paths-ignore:   # docs only: nothing to build
      - '**/*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      arm64:
        description: Also build Windows ARM64 (experimental)
        type: boolean
        default: false

permissions:
  contents: read

# Per PR, otherwise per branch or tag: a new push cancels the run in progress. No github.head_ref: a PR from a
# fork's "main" (or "desktop-v…") branch would cancel the run of the repo's branch of the same name.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'   # no "new pip version" notice in the logs

jobs:
  test:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      # Offscreen platform without a system tray: Qt-internal connection warnings, noise here.
      QT_LOGGING_RULES: qt.core.qobject.connect=false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/requirements.lock

      # The selftest renders with OpenGL even offscreen: Xvfb + Mesa (llvmpipe) provide it.
      - name: Qt libraries, Xvfb and Mesa
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libglib2.0-0t64 libfontconfig1 libgssapi-krb5-2 libdbus-1-3 fonts-dejavu-core \
            libgl1 libgl1-mesa-dri libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            xvfb xauth

      # Hashed lock (versions and sha256 of the whole tree): the one the builds use.
      - name: Python dependencies
        run: python -m pip install --require-hashes -r app/requirements.lock

      - name: Unit tests
        working-directory: app
        run: dbus-run-session -- python -X faulthandler -m unittest discover -s tests -v

      # Generator of the CLI crate notices, shipped in every package.
      - name: License tools
        run: python -m unittest discover -s tools -v

      - name: Burn.qml suite (shim)
        working-directory: app
        run: dbus-run-session -- python tests/run_burn_suite.py

      - name: 'Burn.qml suite: corrupted persisted files'
        working-directory: app
        run: BURN_TEST=corrupt dbus-run-session -- python tests/run_burn_suite.py

      # The suite lowers the Burn.qml CLI timeout (cliTimeoutMs, 120 s in the app) to 10 s: ~20 s of waiting.
      - name: 'Burn.qml suite: stuck CLI'
        working-directory: app
        run: BURN_TEST=timeout dbus-run-session -- python tests/run_burn_suite.py

      - name: Upstream tracking
        run: python3 -I scripts/test_agent_burn_upstream.py

      - name: Selftest (Xvfb, fixtures)
        working-directory: app
        run: |
          AGENT_BURN_FAKE_DIR="$PWD/../tests/fixtures" AGENT_BURN_BIN="$PWD/tests/fake-agent-burn" \
            AGENT_BURN_DATA="$RUNNER_TEMP/selftest-data" \
            xvfb-run -a -s '-screen 0 1920x1080x24' \
            dbus-run-session -- python -m agentburn --selftest "$RUNNER_TEMP/selftest"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: selftest-linux-dev
          path: ${{ runner.temp }}/selftest/
          retention-days: 7

  linux:
    name: Linux (packages)
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      # Pinned by digest (multi-arch index), as in linux/build-local.sh: it produces the packages.
      image: docker.io/library/python:3.12-slim-bookworm@sha256:6a0e06f5ba0b373d051aabd3fffb9b873f27f9a2a3a14bcbe37dee6f0e3bbc70
    env:
      # A single list to restore and save: it is part of the cache version.
      CLI_CACHE: |
        ~/.cargo/registry/index/
        ~/.cargo/registry/cache/
        ~/.cargo/git/db/
        build/cli-linux
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: CLI revision (cli.env)
        id: rev
        run: |
          rev=$(sed -nE 's/^AB_REV=([0-9a-f]+).*/\1/p' cli.env)
          echo "rev=${rev:?AB_REV not found in cli.env}" >> "$GITHUB_OUTPUT"

      - id: cli
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ env.CLI_CACHE }}
          key: agent-burn-cli-linux-x64-${{ steps.rev.outputs.rev }}
          restore-keys: agent-burn-cli-linux-x64-

      # Extracted fonts (app/fonts, ignored by git): build.sh rechecks their sha256 and downloads again on any mismatch.
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: app/fonts
          key: fonts-jetbrainsmono-nf-v3.4.0   # change it along with the font version in build.sh and build.ps1

      - name: 'Build: bundle, AppImage, .deb, .rpm, archive'
        env:
          CLI_HIT: ${{ steps.cli.outputs.cache-hit }}
          # build-info.json of a PR: its head commit, not the merge commit in GITHUB_SHA (read-only).
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Restored by restore-keys (CLI of another revision) or release tag (CLI always built from source,
          # never taken from a cache): only the cargo registry will be reused.
          if [ "$CLI_HIT" = true ] && [[ "$GITHUB_REF" != refs/tags/* ]]; then export SKIP_CLI=1; else rm -rf build/cli-linux; fi
          bash linux/build.sh

      # As soon as the CLI is built, even if the rest fails: the next attempt does not rebuild it.
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        if: ${{ !cancelled() && steps.cli.outputs.cache-hit != 'true' && hashFiles('build/cli-linux/**/agent-burn') != '' }}
        with:
          path: ${{ env.CLI_CACHE }}
          key: ${{ steps.cli.outputs.cache-primary-key }}

      # Also on failure: dist/linux/selftest/ says why.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: agent-burn-desktop-linux
          path: dist/linux/
          if-no-files-found: error
          compression-level: 0   # .deb, .rpm, AppImage and .tar.gz already compressed
          retention-days: 30     # between releases, the only place to get the packages (README)

      # Upstream tracking: the check that needs the real CLI (~/.local/bin/agent-burn), skipped in "Tests", runs here
      # with the CLI from this build.
      - name: Upstream tracking with the real CLI
        run: |
          mkdir -p ~/.local/bin && cp build/cli-linux/bin/agent-burn ~/.local/bin/
          python3 -I scripts/test_agent_burn_upstream.py Upstream.test_synthetic_home_fills_the_keys_with_the_real_cli

  linux-smoke:
    name: Packages on ${{ matrix.image }}
    needs: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Tags, not digests: these images produce nothing, they try the packages on up-to-date distros.
        image: [ubuntu:22.04, ubuntu:24.04, debian:12, debian:13, fedora:44, archlinux:latest, opensuse/tumbleweed]
    container:
      image: ${{ matrix.image }}
    steps:
      # No git in the image: checkout through the API (archive), enough for smoke.sh.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # Path relative to the workspace: in a "container" job, ${{ runner.temp }} would be the host path and
      # $RUNNER_TEMP the container path.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent-burn-desktop-linux
          path: dist-in

      # An artifact loses the executable bit: smoke.sh makes its copy of the AppImage executable (Arch).
      - name: Installation and selftest
        run: bash linux/smoke.sh "$PWD/dist-in"

      # Installation, selftest and uninstallation logs from smoke.sh (dist-in/smoke-<distro>/).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: smoke-${{ strategy.job-index }}
          path: dist-in/smoke-*/
          retention-days: 7

  windows:
    name: ${{ matrix.arch == 'arm64' && 'Windows ARM64 (experimental)' || 'Windows x64' }}
    needs: test
    runs-on: ${{ matrix.arch == 'arm64' && 'windows-11-arm' || 'windows-2025' }}
    timeout-minutes: 45
    continue-on-error: ${{ matrix.arch == 'arm64' }}
    strategy:
      fail-fast: false
      matrix:
        # ARM64 only on request (workflow_dispatch, arm64 checkbox); its failure does not fail the run.
        arch: ${{ fromJSON(inputs.arm64 && '["x64", "arm64"]' || '["x64"]') }}
    defaults:
      run:
        shell: pwsh
    env:
      ARCH: ${{ matrix.arch }}
      CLI_CACHE: |
        ~/.cargo/registry/index/
        ~/.cargo/registry/cache/
        ~/.cargo/git/db/
        build/cli
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          # 3.13: python.org no longer publishes Windows binaries for 3.12 (source only), its OpenSSL or SQLite
          # would no longer get fixes. Linux keeps 3.12 (build image).
          python-version: '3.13'
          architecture: ${{ matrix.arch }}
          cache: pip
          cache-dependency-path: app/requirements.lock

      # In the build.ps1 venv (.venv): the tests see the build environment, which build.ps1 only rechecks.
      - name: Python dependencies
        run: |
          python -m venv .venv
          ./.venv/Scripts/python.exe -m pip install --require-hashes -r app/requirements.lock

      # On a real Windows: winreg, ctypes and Windows paths are not simulated. UTF-8 in this step only
      # (otherwise cp1252, and non-ASCII messages arrive garbled): build.ps1 and the selftest stay in cp1252.
      - name: Unit tests
        working-directory: app
        timeout-minutes: 5   # ~20 s: a stuck Qt window does not hold the job for 45 min
        env:
          PYTHONIOENCODING: utf-8
        run: ../.venv/Scripts/python.exe -X faulthandler -m unittest discover -s tests -v

      - name: CLI revision (cli.env)
        id: rev
        run: |
          $rev = [regex]::Match((Get-Content -Raw cli.env), '(?m)^AB_REV=(\w+)').Groups[1].Value
          if (-not $rev) { throw 'AB_REV not found in cli.env' }
          "rev=$rev" >> $env:GITHUB_OUTPUT

      - id: cli
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ env.CLI_CACHE }}
          key: agent-burn-cli-windows-${{ matrix.arch }}-${{ steps.rev.outputs.rev }}
          restore-keys: agent-burn-cli-windows-${{ matrix.arch }}-

      # As on Linux: build.ps1 rechecks the sha256 sums (otherwise a 129 MB zip downloaded on every run).
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: app/fonts
          key: fonts-jetbrainsmono-nf-v3.4.0

      - name: Inno Setup (if missing from the image)
        run: |
          if (-not (Test-Path 'C:/Program Files (x86)/Inno Setup 6/ISCC.exe')) { choco install innosetup --version=6.7.1 -y --no-progress }

      - name: 'Build: CLI, bundle, selftest, zip, installer'
        id: build
        env:
          CLI_HIT: ${{ steps.cli.outputs.cache-hit }}
        run: |
          if ($env:CLI_HIT -eq 'true' -and $env:GITHUB_REF -notlike 'refs/tags/*') { pwsh -File build.ps1 -Arch $env:ARCH -SkipCli }
          else {
              # Restored by restore-keys (CLI of another revision) or release tag (CLI always built from
              # source): only the cargo registry will be reused.
              Remove-Item build/cli -Recurse -Force -ErrorAction Ignore
              pwsh -File build.ps1 -Arch $env:ARCH
          }

      # As soon as the CLI is built, even if the rest fails: the next attempt does not rebuild it.
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        if: ${{ !cancelled() && steps.cli.outputs.cache-hit != 'true' && hashFiles('build/cli/**/agent-burn.exe') != '' }}
        with:
          path: ${{ env.CLI_CACHE }}
          key: ${{ steps.cli.outputs.cache-primary-key }}

      # Before smoke.ps1: on failure, the installer stays downloadable to try it by hand.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-burn-desktop-windows-${{ matrix.arch }}
          path: |
            dist/AgentBurn-Setup-*-${{ matrix.arch }}.exe
            dist/AgentBurn-portable-*-${{ matrix.arch }}.zip
          if-no-files-found: error
          compression-level: 0   # installer (LZMA) and zip already compressed
          retention-days: 30     # like the Linux packages

      - name: Installation, launch, uninstallation
        run: |
          $setup = (Resolve-Path "dist/AgentBurn-Setup-*-$env:ARCH.exe").Path
          $zip = (Resolve-Path "dist/AgentBurn-portable-*-$env:ARCH.zip").Path
          pwsh -File windows/smoke.ps1 -Setup $setup -Portable $zip

      # dist/smoke/ from smoke.ps1: installation and uninstallation logs, selftests of the installed exe and of the
      # zip; without the extracted copy of the zip (~170 MB).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.build.outcome != 'skipped' }}   # nothing to upload without a build
        with:
          name: selftest-windows-${{ matrix.arch }}
          path: |
            dist/selftest/
            dist/smoke/
            !dist/smoke/portable/
          retention-days: 7

  release:
    name: Release (draft)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/desktop-v')
    needs: [linux, linux-smoke, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: agent-burn-desktop-*
          path: dl

      # Packages only (neither selftest nor the partial SHA256SUMS of the Linux build); one checksum file for all.
      - name: SHA256SUMS and draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Packages named after __version__: a tag for another version would give a release with a wrong title.
          v=${GITHUB_REF_NAME#desktop-v}
          [ -f "dl/agent-burn-desktop-linux/agent-burn-desktop_${v}_amd64.deb" ] &&
            [ -f "dl/agent-burn-desktop-windows-x64/AgentBurn-Setup-$v-x64.exe" ] ||
            { echo "::error::tag $GITHUB_REF_NAME: no $v packages (app __version__ differs?)"; exit 1; }
          mkdir release
          cp dl/agent-burn-desktop-linux/*.{tar.gz,AppImage,deb,rpm} dl/agent-burn-desktop-windows-x64/*.{exe,zip} release/
          (cd release && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "Agent Burn $v" \
            --notes "Draft created by CI: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Verification: sha256sum -c --ignore-missing SHA256SUMS" \
            -- release/*
